<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- ValidMind design system: brand #de267e · deep teal #083e44 · rules blue #3266dc ·
       agent indigo #604af8 · human amber #c47228 · neutrals (teal-tinted greys) -->
  <defs>
    <marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a4afaf"/>
    </marker>
    <marker id="ahb" markerWidth="11" markerHeight="11" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#a4afaf"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- OpenShift project boundary -->
  <rect x="14" y="14" width="972" height="532" rx="14" fill="#f7f9f9" stroke="#e0e7e7"/>
  <text x="34" y="44" font-size="13" font-weight="600" fill="#7e8888">OPENSHIFT PROJECT · ONE HELM RELEASE</text>

  <!-- ═══ top flow: User → sandbox(Agent) → Atryum → tools ═══ -->

  <!-- User -->
  <circle cx="105" cy="160" r="48" fill="#ffffff" stroke="#e0e7e7" stroke-width="1.5"/>
  <text x="105" y="157" font-size="15" font-weight="600" text-anchor="middle" fill="#083e44">You</text>
  <text x="105" y="175" font-size="11" text-anchor="middle" fill="#7e8888">demo dashboard</text>

  <!-- wire: prompt -->
  <line x1="153" y1="160" x2="212" y2="160" stroke="#a4afaf" stroke-width="2" marker-end="url(#ah)"/>
  <text x="183" y="146" font-size="11" font-weight="500" text-anchor="middle" fill="#596162">run agent</text>

  <!-- Agent sandbox (dashed, indigo) -->
  <rect x="216" y="88" width="188" height="150" rx="12" fill="none" stroke="#604af8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="252" y="80" width="116" height="16" fill="#f7f9f9"/>
  <text x="310" y="93" font-size="12" font-weight="600" text-anchor="middle" fill="#604af8">Agent sandbox</text>
  <circle cx="310" cy="165" r="46" fill="#ffffff" stroke="#e0e7e7" stroke-width="1.5"/>
  <text x="310" y="161" font-size="15" font-weight="600" text-anchor="middle" fill="#083e44">Agent</text>
  <text x="310" y="179" font-size="10.5" text-anchor="middle" fill="#7e8888">finance · GDPR ×6</text>

  <!-- wire: tool calls -->
  <line x1="404" y1="160" x2="468" y2="160" stroke="#a4afaf" stroke-width="2" marker-end="url(#ah)"/>
  <text x="436" y="146" font-size="11" font-weight="500" text-anchor="middle" fill="#596162">tool calls</text>

  <!-- Atryum hero node -->
  <rect x="472" y="118" width="216" height="86" rx="12" fill="#ffffff" stroke="#e0e7e7"/>
  <rect x="472" y="118" width="216" height="86" rx="12" fill="none" stroke="#083e44" stroke-opacity="0.18" stroke-width="3"/>
  <text x="580" y="158" font-size="26" font-weight="700" text-anchor="middle" fill="#083e44">Atryum</text>
  <text x="580" y="182" font-size="11" text-anchor="middle" fill="#596162">every tool call checked before it runs</text>

  <!-- wire: if approved (bidirectional) -->
  <line x1="688" y1="160" x2="838" y2="160" stroke="#a4afaf" stroke-width="2" marker-start="url(#ahb)" marker-end="url(#ah)"/>
  <text x="763" y="146" font-size="11" font-weight="500" text-anchor="middle" fill="#596162">if approved</text>

  <!-- External service / demo tools -->
  <circle cx="895" cy="160" r="52" fill="#ffffff" stroke="#e0e7e7" stroke-width="1.5"/>
  <text x="895" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="#083e44">Demo</text>
  <text x="895" y="167" font-size="14" font-weight="600" text-anchor="middle" fill="#083e44">backends</text>
  <text x="895" y="184" font-size="10.5" text-anchor="middle" fill="#7e8888">payments · trades · DSRs</text>

  <!-- ═══ decision layer wires (bidirectional, Atryum ↓) ═══ -->
  <path d="M520,204 C495,250 470,262 448,300" fill="none" stroke="#a4afaf" stroke-width="2" marker-start="url(#ahb)" marker-end="url(#ah)"/>
  <line x1="580" y1="204" x2="580" y2="300" stroke="#a4afaf" stroke-width="2" marker-start="url(#ahb)" marker-end="url(#ah)"/>
  <path d="M655,204 C710,245 775,258 820,300" fill="none" stroke="#a4afaf" stroke-width="2" marker-start="url(#ahb)" marker-end="url(#ah)"/>

  <!-- Static rules (blue accent) -->
  <g>
    <rect x="310" y="304" width="200" height="84" rx="12" fill="#ffffff" stroke="#e0e7e7"/>
    <rect x="310" y="304" width="6" height="84" rx="3" fill="#3266dc"/>
    <text x="415" y="338" font-size="15" font-weight="600" text-anchor="middle" fill="#083e44">Static rules</text>
    <text x="415" y="358" font-size="11.5" text-anchor="middle" fill="#7e8888">deterministic ACLs — reads</text>
    <text x="415" y="373" font-size="11.5" text-anchor="middle" fill="#7e8888">auto-approved in ~1 ms</text>
  </g>

  <!-- Agent charter / AI evaluation (brand magenta accent) -->
  <g>
    <rect x="530" y="304" width="210" height="84" rx="12" fill="#ffffff" stroke="#e0e7e7"/>
    <rect x="530" y="304" width="6" height="84" rx="3" fill="#de267e"/>
    <text x="638" y="338" font-size="15" font-weight="600" text-anchor="middle" fill="#083e44">Agent charter</text>
    <text x="638" y="358" font-size="11.5" text-anchor="middle" fill="#7e8888">AI evaluation — the judge reads</text>
    <text x="638" y="373" font-size="11.5" text-anchor="middle" fill="#7e8888">the call against the charter</text>
  </g>

  <!-- Human approval (amber accent) -->
  <g>
    <rect x="760" y="304" width="190" height="84" rx="12" fill="#ffffff" stroke="#e0e7e7"/>
    <rect x="760" y="304" width="6" height="84" rx="3" fill="#c47228"/>
    <text x="858" y="338" font-size="15" font-weight="600" text-anchor="middle" fill="#083e44">Human approval</text>
    <text x="858" y="358" font-size="11.5" text-anchor="middle" fill="#7e8888">high-stakes calls held,</text>
    <text x="858" y="373" font-size="11.5" text-anchor="middle" fill="#7e8888">not slowed — you decide</text>
  </g>

  <!-- judge → LLM wire -->
  <line x1="638" y1="388" x2="638" y2="438" stroke="#a4afaf" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ═══ bottom band: supporting pieces ═══ -->

  <!-- Seed job -->
  <g>
    <rect x="50" y="442" width="280" height="76" rx="12" fill="#ffffff" stroke="#e0e7e7"/>
    <rect x="50" y="442" width="6" height="76" rx="3" fill="#2e8994"/>
    <text x="193" y="472" font-size="14" font-weight="600" text-anchor="middle" fill="#083e44">configure Job (helm hook)</text>
    <text x="193" y="492" font-size="11.5" text-anchor="middle" fill="#7e8888">seeds servers, 6 agents + charters,</text>
    <text x="193" y="506" font-size="11.5" text-anchor="middle" fill="#7e8888">rules, judge — via Atryum's REST API</text>
  </g>
  <path d="M240,442 C250,330 360,250 466,196" fill="none" stroke="#2e8994" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- LLM endpoint -->
  <g>
    <rect x="520" y="442" width="236" height="76" rx="12" fill="#ffffff" stroke="#e0e7e7"/>
    <rect x="520" y="442" width="6" height="76" rx="3" fill="#de267e"/>
    <text x="641" y="472" font-size="14" font-weight="600" text-anchor="middle" fill="#083e44">LLM endpoint</text>
    <text x="641" y="492" font-size="11.5" text-anchor="middle" fill="#7e8888">OpenAI or compatible — one key</text>
    <text x="641" y="506" font-size="11.5" text-anchor="middle" fill="#7e8888">for the judge and the demo agents</text>
  </g>

  <!-- PostgreSQL -->
  <g>
    <rect x="786" y="442" width="164" height="76" rx="12" fill="#ffffff" stroke="#e0e7e7"/>
    <rect x="786" y="442" width="6" height="76" rx="3" fill="#7e8888"/>
    <text x="871" y="472" font-size="14" font-weight="600" text-anchor="middle" fill="#083e44">PostgreSQL</text>
    <text x="871" y="492" font-size="11.5" text-anchor="middle" fill="#7e8888">rules · charters ·</text>
    <text x="871" y="506" font-size="11.5" text-anchor="middle" fill="#7e8888">durable audit log</text>
  </g>
</svg>
