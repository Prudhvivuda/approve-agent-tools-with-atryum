# One LLM credential powers both Atryum's AI-evaluation judge (seeded by the
# configure Job) and the demo agents. The demo agents use the OpenAI SDK, whose
# base_url includes /v1 — appended here so model.endpoint stays in the
# quickstart-standard no-/v1 form.
{{- $endpoint := include "quickstart.modelEndpoint" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-llm
    {{- include "quickstart.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ required "Set model.api_key (make install reads MODEL_API_KEY from .env)" .Values.model.api_key | quote }}
  LLM_MODEL: {{ required "Set model.name" .Values.model.name | quote }}
  LLM_BASE_URL: {{ ternary "" (printf "%s/v1" $endpoint) (eq $endpoint "") | quote }}
