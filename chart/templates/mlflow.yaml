{{- if .Values.mlflow.deploy }}
{{- if .Values.mlflow.tracesEndpoint }}
{{- fail "Use either mlflow.deploy or mlflow.tracesEndpoint" }}
{{- end }}
{{- $name := include "quickstart.mlflow" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mlflow.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: {{ .Values.mlflow.image | quote }}
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --backend-store-uri=sqlite:////mlflow-data/mlflow.db
            - --artifacts-destination=/mlflow-data/artifacts
            - {{ printf "--allowed-hosts=%s,%s:5000,%s.%s.svc.cluster.local:5000,localhost:5000,127.0.0.1:5000" $name $name $name .Release.Namespace | quote }}
          env:
            - name: HOME
              value: /tmp
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
          workingDir: /mlflow-data
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              port: http
              path: /health
              httpHeaders:
                - name: Host
                  value: {{ $name }}
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /mlflow-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "quickstart.atryum" . }}
      ports:
        - port: 5000
{{- end }}
