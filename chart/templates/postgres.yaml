apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quickstart.postgres" . }}
  labels:
    app.kubernetes.io/name: {{ include "quickstart.postgres" . }}
    app.kubernetes.io/component: database
    {{- include "quickstart.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-user: {{ .Values.postgres.user | quote }}
  database-password: {{ include "quickstart.postgresPassword" . | quote }}
  database-name: {{ .Values.postgres.database | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quickstart.postgres" . }}-data
  labels:
    app.kubernetes.io/name: {{ include "quickstart.postgres" . }}
    {{- include "quickstart.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgres.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quickstart.postgres" . }}
  labels:
    app.kubernetes.io/name: {{ include "quickstart.postgres" . }}
    {{- include "quickstart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "quickstart.postgres" . }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quickstart.postgres" . }}
  labels:
    app.kubernetes.io/name: {{ include "quickstart.postgres" . }}
    app.kubernetes.io/component: database
    {{- include "quickstart.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quickstart.postgres" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "quickstart.postgres" . }}
        app.kubernetes.io/component: database
        {{- include "quickstart.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "quickstart.postgres" . }}
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "quickstart.postgres" . }}
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "quickstart.postgres" . }}
                  key: database-name
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 120
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "quickstart.postgres" . }}-data
